# fly.toml — Car Photo API
# Region: Frankfurt (fra) — EU
# Deploy: flyctl deploy (from this directory)
# Secrets: flyctl secrets set PHOTOROOM_API_KEY=<your-key>

app = "car-photo-api"
primary_region = "fra"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
